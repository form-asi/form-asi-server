name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-prod
  cancel-in-progress: false


env:
  AWS_REGION: ap-northeast-2
  APP_DIR: /home/ubuntu/app

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build jar
        run: ./gradlew clean bootJar --no-daemon

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          SSM_PARAM_PATH: ${{ secrets.SSM_PARAM_PATH }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Deploying tag ${IMAGE_TAG}"

          {
            echo "IMAGE='${IMAGE}'"
            echo "REGISTRY='${REGISTRY}'"
            echo "REGION='${AWS_REGION}'"
            echo "PARAM_PATH='${SSM_PARAM_PATH}'"
            echo "APP_DIR='${APP_DIR}'"
            echo "COMPOSE_B64='$(gzip -9c deploy/compose.prod.yaml | base64 -w0)'"
            cat <<'REMOTE'
          set -euo pipefail
          export PATH="$PATH:/snap/bin"
          mkdir -p "$APP_DIR" && cd "$APP_DIR"

          # 1) compose 파일 동기화
          echo "$COMPOSE_B64" | base64 -d | gunzip > compose.prod.yaml

          # 2) Parameter Store → .env (작은따옴표로 감싸 $ 등이 치환되지 않게)
          umask 077
          aws ssm get-parameters-by-path --path "$PARAM_PATH" --with-decryption --region "$REGION" \
            --query 'Parameters[].[Name,Value]' --output text \
            | awk -F'\t' '{n=$1; sub(".*/","",n); if (n != "HTPASSWD") printf "%s='\''%s'\''\n", n, $2}' > .env.new
          mv .env.new .env
          chown ubuntu:ubuntu .env compose.prod.yaml

          # 3) ECR 로그인 → 이미지 교체
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          export APP_IMAGE="$IMAGE"
          docker compose -f compose.prod.yaml pull app
          docker compose -f compose.prod.yaml up -d --remove-orphans

          # 4) health 확인 (최대 3분)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '"UP"'; then
              echo "health check passed"
              docker image prune -af >/dev/null || true
              exit 0
            fi
            sleep 3
          done
          # 퍼블릭 레포라 앱 로그(DB 주소 등)는 Actions에 출력하지 않음 → EC2에서 직접 확인
          echo "health check failed: EC2에서 'docker logs --tail 200 form-asi-app' 로 원인 확인"
          exit 1
          REMOTE
          } > remote.sh

          PAYLOAD="$(gzip -9c remote.sh | base64 -w0)"
          jq -n --arg p "$PAYLOAD" '{commands: ["echo \($p) | base64 -d | gunzip | bash"]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "form-asi deploy ${IMAGE_TAG}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: ${CMD_ID}"

          STATUS=Pending
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "----- EC2 stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- EC2 stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          echo "status: ${STATUS}"
          [ "$STATUS" = "Success" ]
