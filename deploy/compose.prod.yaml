# 운영(EC2) 실행 구성. cd.yml이 배포할 때마다 이 파일을 EC2의 /home/ubuntu/app 으로 복사한다.
# 같은 디렉토리의 .env(Parameter Store에서 생성)를 앱 환경변수와 ${...} 치환에 함께 사용한다.
name: form-asi

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: form-asi-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - valkey
    restart: unless-stopped
    mem_limit: 700m

  valkey:
    image: valkey/valkey:9.1
    container_name: form-asi-valkey
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    mem_limit: 128m

volumes:
  valkey_data:
